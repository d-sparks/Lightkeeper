<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Dungeon Crawler</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #0d0d1a;
      width: 100%; height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      color: #ccc;
    }

    #title-bar {
      font-size: 14px;
      color: #ffa726;
      letter-spacing: 2px;
      padding: 6px 0 4px 0;
      text-align: center;
    }

    #game-area {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    canvas#game {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 1px solid #333;
    }

    /* Virtual joystick area */
    #controls {
      width: 100%;
      height: 160px;
      position: relative;
      display: none;  /* shown on touch devices */
      flex-shrink: 0;
    }

    #joystick-zone {
      position: absolute;
      left: 20px;
      bottom: 10px;
      width: 140px;
      height: 140px;
    }

    #joystick-base {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.12);
    }

    #joystick-thumb {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,167,38,0.35);
      border: 2px solid rgba(255,167,38,0.6);
      transition: background 0.1s;
    }

    #switch-btn {
      position: absolute;
      right: 30px;
      bottom: 45px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.15);
      color: #aaa;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.2;
    }

    #switch-btn:active {
      background: rgba(255,167,38,0.2);
      border-color: rgba(255,167,38,0.5);
    }

    #interact-btn {
      position: absolute;
      right: 110px;
      bottom: 45px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(100,181,246,0.1);
      border: 2px solid rgba(100,181,246,0.25);
      color: #64b5f6;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #interact-btn.visible { display: flex; }

    #interact-btn:active {
      background: rgba(100,181,246,0.3);
      border-color: rgba(100,181,246,0.6);
    }

    #dialogue-overlay {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10, 10, 26, 0.92);
      border-top: 2px solid #64b5f6;
      padding: 14px 18px 12px;
      z-index: 100;
    }

    #dialogue-speaker {
      font-size: 12px;
      color: #64b5f6;
      font-family: 'Courier New', monospace;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    #dialogue-text {
      font-size: 14px;
      color: #ddd;
      font-family: 'Courier New', monospace;
      line-height: 1.4;
      min-height: 38px;
    }

    #dialogue-prompt {
      font-size: 10px;
      color: #777;
      font-family: 'Courier New', monospace;
      margin-top: 8px;
      text-align: right;
    }

    .info-text {
      font-size: 10px;
      color: #444;
      text-align: center;
      padding: 4px 0;
    }

    /* Desktop: hide touch controls, show keyboard hint */
    @media (hover: hover) and (pointer: fine) {
      #controls { display: none !important; }
      .mobile-only { display: none !important; }
    }
    /* Touch devices: show controls */
    @media (hover: none) and (pointer: coarse) {
      #controls { display: block !important; }
      .desktop-only { display: none !important; }
    }
  </style>
</head>
<body>

<div id="title-bar">⚔ DUNGEON CRAWLER ⚔</div>

<div id="game-area">
  <canvas id="game"></canvas>
</div>

<div class="info-text desktop-only">WASD / Arrows = Move &nbsp;|&nbsp; 1-4 = Switch character &nbsp;|&nbsp; E = Interact</div>

<div id="controls">
  <div id="joystick-zone">
    <div id="joystick-base"></div>
    <div id="joystick-thumb"></div>
  </div>
  <div id="switch-btn" role="button">Switch<br>Char</div>
  <div id="interact-btn" role="button">Talk</div>
</div>

<div id="dialogue-overlay">
  <div id="dialogue-speaker"></div>
  <div id="dialogue-text"></div>
  <div id="dialogue-prompt">[E] Continue</div>
</div>

<script>
// ============================================================
// CONSTANTS
// ============================================================
const TILE_SIZE = 32;
const PLAYER_RADIUS = 12;
const PLAYER_SPEED = 4;
const MONSTER_COLLISION_RADIUS = 10;
const MONSTER_AGGRO_RANGE = 8;
const PLAYER_ATTACK_RANGE = 1.5;
const PLAYER_ATTACK_DAMAGE = 15;
const PLAYER_ATTACK_COOLDOWN = 0.5;

const NPC_INTERACT_RANGE = 2.5;

const COLORS = {
  floor:      '#2a2a3d',
  cracked:    '#332a3d',
  wall:       '#5a5a7a',
  stairsDown: '#6a3a8a',
  stairsUp:   '#3a8a6a',
  void:       '#0d0d1a',
  background: '#1a1a2e',
  player:     ['#4fc3f7', '#ef5350', '#66bb6a', '#ffa726'],
  npc:        '#64b5f6',
  monster:    '#e53935',
};

// ============================================================
// RESPONSIVE CANVAS SIZING
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

let VIEWPORT_TX, VIEWPORT_TY, viewW, viewH, canvasScale;

function resizeCanvas() {
  const gameArea = document.getElementById('game-area');
  const availW = gameArea.clientWidth;
  const availH = gameArea.clientHeight;

  // Calculate how many tiles we can fit
  // On mobile, use fewer tiles for larger apparent size
  const isMobile = ('ontouchstart' in window);
  const targetTileScreenPx = isMobile ? 28 : 32;  // smaller = more tiles visible

  VIEWPORT_TX = Math.floor(availW / targetTileScreenPx) | 1; // ensure odd
  VIEWPORT_TY = Math.floor(availH / targetTileScreenPx) | 1;
  if (VIEWPORT_TX % 2 === 0) VIEWPORT_TX--;
  if (VIEWPORT_TY % 2 === 0) VIEWPORT_TY--;
  VIEWPORT_TX = Math.max(9, Math.min(VIEWPORT_TX, 25));
  VIEWPORT_TY = Math.max(7, Math.min(VIEWPORT_TY, 19));

  viewW = VIEWPORT_TX * TILE_SIZE;
  viewH = VIEWPORT_TY * TILE_SIZE;
  canvas.width = viewW;
  canvas.height = viewH;

  // Scale canvas to fill available space
  const scaleX = availW / viewW;
  const scaleY = availH / viewH;
  canvasScale = Math.min(scaleX, scaleY);
  canvas.style.width = `${Math.floor(viewW * canvasScale)}px`;
  canvas.style.height = `${Math.floor(viewH * canvasScale)}px`;

  ctx.imageSmoothingEnabled = false;
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ============================================================
// MAP — Multi-floor system
// ============================================================
const FLOORS = {
  crypt_01: {
    name: 'The Shallow Crypt',
    layout: [
      '3333333333333333333333333',
      '3111113333333333333333333',
      '3111113333333333333333333',
      '3111111113333333333333333',
      '3111113313333333333333333',
      '3333333313333333333333333',
      '3333333311111113333333333',
      '3333333311111113333333333',
      '3333333311111111113333333',
      '3333333311121113133333333',
      '3333333333333333133333333',
      '3333333333333331111133333',
      '3333333333333331111133333',
      '3333333333333331161133333',
      '3333333333333331111133333',
      '3333333333333333333333333',
    ],
    spawns: [{ x:2,y:2 },{ x:3,y:2 },{ x:2,y:3 },{ x:3,y:3 }],
    exits: [{ x:17, y:13, type:'stairs_down', leadsTo:'crypt_02', spawnX:3, spawnY:3 }],
    npcs: [{
      id: 'old_keeper', name: 'Old Keeper',
      x: 5, y: 3,
      dialogue: [
        { speaker: 'Old Keeper', text: 'Halt, traveler. You have the look of someone seeking the deep dark.' },
        { speaker: 'Old Keeper', text: 'I was a Lightkeeper once... before the relays failed and the shadows crept in.' },
        { speaker: 'Old Keeper', text: 'The creatures down there feed on broken light. They\'ll take everything from you if you let them.' },
        { speaker: 'Old Keeper', text: 'A word of advice: never carry more than you can afford to lose. Death has a price in these crypts.' },
        { speaker: 'Old Keeper', text: 'Now go. The stairs await, and the dark won\'t keep itself at bay.' },
      ],
    }],
    monsterSpawns: [],
  },
  crypt_02: {
    name: 'The Bone Chamber',
    layout: [
      '3333333333333333333333333',
      '3333333333333333333333333',
      '3381113333333333333333333',
      '3311113333333333333333333',
      '3311133333333333333333333',
      '3311111111111113333333333',
      '3333311111111113333333333',
      '3333311112111113333333333',
      '3333311111111113333333333',
      '3333311111111113333333333',
      '3333311111111113333333333',
      '3333333333333333333333333',
      '3333333333333333333333333',
      '3333333333333333333333333',
      '3333333333333333333333333',
      '3333333333333333333333333',
    ],
    spawns: [{ x:3,y:3 },{ x:4,y:3 },{ x:3,y:2 },{ x:4,y:2 }],
    exits: [{ x:2, y:2, type:'stairs_up', leadsTo:'crypt_01', spawnX:17, spawnY:12 }],
    npcs: [],
    monsterSpawns: [
      { type:'skeleton', x:8, y:7, count:2 },
      { type:'skeleton', x:11, y:9, count:1 },
    ],
  },
};

const MONSTER_DEFS = {
  skeleton: { name:'Skeleton', health:30, speed:1.5, damage:8, attackRange:1, attackSpeed:1.0 },
};

// Active floor state
let currentFloorId = 'crypt_01';
let MAP_W = 25, MAP_H = 16;
let MAP_DATA = [];
let currentExits = [];
let currentNpcs = [];
let monsters = [];
let damageNumbers = [];
let transitionCooldown = 0;

const TILE_SOLID = { 0: true, 3: true };

function getTileColor(tid) {
  if (tid === 0) return COLORS.void;
  if (tid === 1) return COLORS.floor;
  if (tid === 2) return COLORS.cracked;
  if (tid === 3) return COLORS.wall;
  if (tid === 6) return COLORS.stairsDown;
  if (tid === 8) return COLORS.stairsUp;
  return '#ff00ff';
}

function loadFloor(floorId, spawnX, spawnY) {
  const floor = FLOORS[floorId];
  if (!floor) return;

  currentFloorId = floorId;
  MAP_W = floor.layout[0].length;
  MAP_H = floor.layout.length;
  MAP_DATA = [];
  for (let y = 0; y < MAP_H; y++)
    for (let x = 0; x < MAP_W; x++)
      MAP_DATA.push(parseInt(floor.layout[y][x]));

  currentExits = floor.exits;
  currentNpcs = floor.npcs.map(n => ({
    ...n,
    x: (n.x + 0.5) * TILE_SIZE,
    y: (n.y + 0.5) * TILE_SIZE,
  }));

  // Spawn monsters
  monsters = [];
  for (const spawn of floor.monsterSpawns) {
    const def = MONSTER_DEFS[spawn.type];
    if (!def) continue;
    const count = spawn.count || 1;
    for (let i = 0; i < count; i++) {
      const offsetX = count > 1 ? (i - (count - 1) / 2) * 1.5 : 0;
      monsters.push({
        id: `mob_${monsters.length}`,
        name: def.name,
        x: (spawn.x + 0.5 + offsetX) * TILE_SIZE,
        y: (spawn.y + 0.5) * TILE_SIZE,
        health: def.health,
        maxHealth: def.health,
        speed: def.speed,
        damage: def.damage,
        attackRange: (def.attackRange || 1) * TILE_SIZE,
        attackCooldown: 1 / (def.attackSpeed || 1),
        attackTimer: 0,
        facing: 0,
      });
    }
  }

  // Move all players to spawn positions
  const spawns = floor.spawns;
  for (let i = 0; i < players.length; i++) {
    const sp = spawns[i] || spawns[0];
    if (spawnX != null && spawnY != null) {
      // Use explicit spawn position (from stairs)
      const offX = (i % 2) * 1;
      const offY = Math.floor(i / 2) * 1;
      players[i].x = (spawnX + 0.5 + offX) * TILE_SIZE;
      players[i].y = (spawnY + 0.5 + offY) * TILE_SIZE;
    } else {
      players[i].x = (sp.x + 0.5) * TILE_SIZE;
      players[i].y = (sp.y + 0.5) * TILE_SIZE;
    }
  }

  transitionCooldown = 1.5;
  damageNumbers = [];
  closeDialogue();
}

function isSolid(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return true;
  return TILE_SOLID[MAP_DATA[ty * MAP_W + tx]] === true;
}

// ============================================================
// PLAYERS
// ============================================================
const players = [0,1,2,3].map(i => ({
  id: i,
  name: ['Hero', 'Rogue', 'Mage', 'Cleric'][i],
  x: 0, y: 0, // set by loadFloor
  facing: 0,
  health: [100, 80, 100, 90][i],
  maxHealth: 100,
  colorIndex: i,
  attackTimer: 0,
}));
let activePlayer = 0;
const aiTimers = players.map(() => ({ nextChange: 0, dx: 0, dy: 0 }));

// Initial load
loadFloor('crypt_01');

// ============================================================
// DIALOGUE STATE
// ============================================================
const dialogueOverlay = document.getElementById('dialogue-overlay');
const dialogueSpeaker = document.getElementById('dialogue-speaker');
const dialogueTextEl = document.getElementById('dialogue-text');
const interactBtn = document.getElementById('interact-btn');

let dialogueActive = false;
let dialogueLines = [];
let dialogueIndex = 0;
let nearbyNPC = null;

function showDialogue(lines) {
  dialogueLines = lines;
  dialogueIndex = 0;
  dialogueActive = true;
  updateDialogueDisplay();
  dialogueOverlay.style.display = 'block';
}

function advanceDialogue() {
  dialogueIndex++;
  if (dialogueIndex >= dialogueLines.length) {
    closeDialogue();
    return;
  }
  updateDialogueDisplay();
}

function closeDialogue() {
  dialogueActive = false;
  dialogueLines = [];
  dialogueIndex = 0;
  dialogueOverlay.style.display = 'none';
}

function updateDialogueDisplay() {
  const line = dialogueLines[dialogueIndex];
  if (!line) return;
  dialogueSpeaker.textContent = line.speaker;
  dialogueTextEl.textContent = line.text;
}

function tryInteract() {
  if (dialogueActive) { advanceDialogue(); return; }
  if (nearbyNPC) showDialogue(nearbyNPC.dialogue);
}

function getNearbyNPC() {
  const me = players[activePlayer];
  const range = NPC_INTERACT_RANGE * TILE_SIZE;
  for (const npc of currentNpcs) {
    const dx = npc.x - me.x, dy = npc.y - me.y;
    if (Math.sqrt(dx * dx + dy * dy) < range) return npc;
  }
  return null;
}

// ============================================================
// INPUT — Keyboard
// ============================================================
const keys = { up: false, down: false, left: false, right: false };
const keyMap = {
  ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
  w:'up',W:'up',s:'down',S:'down',a:'left',A:'left',d:'right',D:'right',
};
window.addEventListener('keydown', (e) => {
  if (e.key === 'e' || e.key === 'E' || e.key === 'Enter') { e.preventDefault(); tryInteract(); return; }
  if (e.key >= '1' && e.key <= '4') { activePlayer = parseInt(e.key) - 1; return; }
  const a = keyMap[e.key]; if (a) { e.preventDefault(); keys[a] = true; }
});
window.addEventListener('keyup', (e) => {
  const a = keyMap[e.key]; if (a) { e.preventDefault(); keys[a] = false; }
});

// ============================================================
// INPUT — Touch Joystick
// ============================================================
const joystickZone = document.getElementById('joystick-zone');
const joystickThumb = document.getElementById('joystick-thumb');
const switchBtn = document.getElementById('switch-btn');

let joystickActive = false;
let joystickTouchId = null;
let joyDX = 0, joyDY = 0;

function getJoystickCenter() {
  const rect = joystickZone.getBoundingClientRect();
  return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
}

function handleJoystickMove(clientX, clientY) {
  const center = getJoystickCenter();
  const maxDist = 50;
  let dx = clientX - center.x;
  let dy = clientY - center.y;
  const dist = Math.sqrt(dx * dx + dy * dy);

  if (dist > maxDist) {
    dx = (dx / dist) * maxDist;
    dy = (dy / dist) * maxDist;
  }

  // Visual feedback
  joystickThumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  joystickThumb.style.background = 'rgba(255,167,38,0.55)';

  // Dead zone
  const deadZone = 12;
  if (dist < deadZone) {
    joyDX = 0; joyDY = 0;
  } else {
    joyDX = dx / maxDist;
    joyDY = dy / maxDist;
  }
}

function resetJoystick() {
  joystickActive = false;
  joystickTouchId = null;
  joyDX = 0; joyDY = 0;
  joystickThumb.style.transform = 'translate(-50%, -50%)';
  joystickThumb.style.background = 'rgba(255,167,38,0.35)';
}

joystickZone.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.changedTouches[0];
  joystickActive = true;
  joystickTouchId = t.identifier;
  handleJoystickMove(t.clientX, t.clientY);
}, { passive: false });

window.addEventListener('touchmove', (e) => {
  if (!joystickActive) return;
  for (const t of e.changedTouches) {
    if (t.identifier === joystickTouchId) {
      e.preventDefault();
      handleJoystickMove(t.clientX, t.clientY);
      break;
    }
  }
}, { passive: false });

window.addEventListener('touchend', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier === joystickTouchId) {
      resetJoystick();
      break;
    }
  }
});

window.addEventListener('touchcancel', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier === joystickTouchId) {
      resetJoystick();
      break;
    }
  }
});

// Switch character button
switchBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  activePlayer = (activePlayer + 1) % players.length;
}, { passive: false });

switchBtn.addEventListener('click', (e) => {
  e.preventDefault();
  activePlayer = (activePlayer + 1) % players.length;
});

// Interact button (touch)
interactBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  tryInteract();
}, { passive: false });

interactBtn.addEventListener('click', (e) => {
  e.preventDefault();
  tryInteract();
});

// Also allow tapping dialogue overlay to advance
dialogueOverlay.addEventListener('click', () => {
  if (dialogueActive) advanceDialogue();
});

// Prevent accidental zooming / scrolling
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('gesturechange', (e) => e.preventDefault());

// ============================================================
// PHYSICS
// ============================================================
function collidesAt(px, py, radius) {
  const r = radius || PLAYER_RADIUS;
  const minTX = Math.floor((px - r) / TILE_SIZE);
  const maxTX = Math.floor((px + r) / TILE_SIZE);
  const minTY = Math.floor((py - r) / TILE_SIZE);
  const maxTY = Math.floor((py + r) / TILE_SIZE);
  for (let ty = minTY; ty <= maxTY; ty++) {
    for (let tx = minTX; tx <= maxTX; tx++) {
      if (isSolid(tx, ty)) {
        const nearX = Math.max(tx * TILE_SIZE, Math.min(px, (tx + 1) * TILE_SIZE));
        const nearY = Math.max(ty * TILE_SIZE, Math.min(py, (ty + 1) * TILE_SIZE));
        const dx = px - nearX, dy = py - nearY;
        if (dx * dx + dy * dy < r * r) return true;
      }
    }
  }
  return false;
}

function movePlayer(p, dx, dy, dt) {
  const speed = PLAYER_SPEED * TILE_SIZE * dt;
  const len = Math.sqrt(dx * dx + dy * dy);
  if (len > 0.01) {
    dx /= len; dy /= len;
  } else {
    return;
  }
  const nx = p.x + dx * speed;
  const ny = p.y + dy * speed;
  if (!collidesAt(nx, p.y)) p.x = nx;
  if (!collidesAt(p.x, ny)) p.y = ny;
  p.facing = Math.atan2(dy, dx);
}

// ============================================================
// UPDATE
// ============================================================
function update(dt, now) {
  // Combine keyboard + joystick input for active player
  let dx = joyDX, dy = joyDY;
  if (keys.up)    dy -= 1;
  if (keys.down)  dy += 1;
  if (keys.left)  dx -= 1;
  if (keys.right) dx += 1;
  const len = Math.sqrt(dx * dx + dy * dy);
  if (len > 1) { dx /= len; dy /= len; }

  movePlayer(players[activePlayer], dx, dy, dt);

  // Check nearby NPC for interact prompt
  nearbyNPC = getNearbyNPC();
  const isMobile = ('ontouchstart' in window);
  if (isMobile) {
    interactBtn.classList.toggle('visible', !!nearbyNPC || dialogueActive);
  }

  // AI for other party members
  for (let i = 0; i < players.length; i++) {
    if (i === activePlayer) continue;
    const ai = aiTimers[i];
    if (now > ai.nextChange) {
      ai.dx = Math.floor(Math.random() * 3) - 1;
      ai.dy = Math.floor(Math.random() * 3) - 1;
      ai.nextChange = now + 500 + Math.random() * 2000;
    }
    movePlayer(players[i], ai.dx, ai.dy, dt * 0.5);
  }

  // Monster AI
  for (let mi = monsters.length - 1; mi >= 0; mi--) {
    const mob = monsters[mi];
    mob.attackTimer = Math.max(0, mob.attackTimer - dt);

    // Find nearest player
    let nearest = null, nearestDist = Infinity;
    for (const p of players) {
      const ddx = p.x - mob.x, ddy = p.y - mob.y;
      const d = Math.sqrt(ddx * ddx + ddy * ddy);
      if (d < nearestDist) { nearest = p; nearestDist = d; }
    }
    if (!nearest) continue;

    const aggroRange = MONSTER_AGGRO_RANGE * TILE_SIZE;
    if (nearestDist > aggroRange) continue;

    if (nearestDist > mob.attackRange) {
      // Chase
      const cdx = nearest.x - mob.x, cdy = nearest.y - mob.y;
      const clen = Math.sqrt(cdx * cdx + cdy * cdy);
      if (clen > 0) {
        const speed = mob.speed * TILE_SIZE * dt;
        const nx = mob.x + (cdx / clen) * speed;
        const ny = mob.y + (cdy / clen) * speed;
        if (!collidesAt(nx, mob.y, MONSTER_COLLISION_RADIUS)) mob.x = nx;
        if (!collidesAt(mob.x, ny, MONSTER_COLLISION_RADIUS)) mob.y = ny;
        mob.facing = Math.atan2(cdy, cdx);
      }
    } else if (mob.attackTimer <= 0) {
      // Attack
      nearest.health -= mob.damage;
      mob.attackTimer = mob.attackCooldown;
      damageNumbers.push({ text: `-${mob.damage}`, x: nearest.x, y: nearest.y, age: 0, color: '#e53935' });
      if (nearest.health <= 0) {
        nearest.health = nearest.maxHealth;
        const sp = FLOORS[currentFloorId].spawns[0];
        nearest.x = (sp.x + 0.5) * TILE_SIZE;
        nearest.y = (sp.y + 0.5) * TILE_SIZE;
      }
    }
  }

  // Player auto-attack
  const atkRange = PLAYER_ATTACK_RANGE * TILE_SIZE;
  for (const p of players) {
    if (!p.attackTimer) p.attackTimer = 0;
    p.attackTimer = Math.max(0, p.attackTimer - dt);
    if (p.attackTimer > 0) continue;

    let nearMob = null, nearDist = Infinity;
    for (const mob of monsters) {
      const adx = mob.x - p.x, ady = mob.y - p.y;
      const ad = Math.sqrt(adx * adx + ady * ady);
      if (ad < atkRange && ad < nearDist) { nearMob = mob; nearDist = ad; }
    }
    if (nearMob) {
      nearMob.health -= PLAYER_ATTACK_DAMAGE;
      p.attackTimer = PLAYER_ATTACK_COOLDOWN;
      damageNumbers.push({ text: `-${PLAYER_ATTACK_DAMAGE}`, x: nearMob.x, y: nearMob.y, age: 0, color: '#ffa726' });
      if (nearMob.health <= 0) {
        monsters.splice(monsters.indexOf(nearMob), 1);
      }
    }
  }

  // Floor transitions
  if (transitionCooldown > 0) {
    transitionCooldown -= dt;
  } else {
    const me = players[activePlayer];
    const ptx = Math.floor(me.x / TILE_SIZE);
    const pty = Math.floor(me.y / TILE_SIZE);
    for (const exit of currentExits) {
      if (ptx === exit.x && pty === exit.y) {
        loadFloor(exit.leadsTo, exit.spawnX, exit.spawnY);
        break;
      }
    }
  }
}

// ============================================================
// RENDERER
// ============================================================
let camX = 0, camY = 0;

function render(now) {
  const me = players[activePlayer];
  const targetCX = me.x - viewW / 2;
  const targetCY = me.y - viewH / 2;
  const mapPxW = MAP_W * TILE_SIZE;
  const mapPxH = MAP_H * TILE_SIZE;
  camX = Math.max(0, Math.min(targetCX, mapPxW - viewW));
  camY = Math.max(0, Math.min(targetCY, mapPxH - viewH));

  ctx.fillStyle = COLORS.background;
  ctx.fillRect(0, 0, viewW, viewH);

  // Tiles
  const stx = Math.floor(camX / TILE_SIZE);
  const sty = Math.floor(camY / TILE_SIZE);
  const etx = Math.ceil((camX + viewW) / TILE_SIZE);
  const ety = Math.ceil((camY + viewH) / TILE_SIZE);
  for (let ty = sty; ty <= ety; ty++) {
    for (let tx = stx; tx <= etx; tx++) {
      if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) continue;
      const tid = MAP_DATA[ty * MAP_W + tx];
      const sx = tx * TILE_SIZE - camX;
      const sy = ty * TILE_SIZE - camY;
      ctx.fillStyle = getTileColor(tid);
      ctx.fillRect(sx, sy, TILE_SIZE, TILE_SIZE);
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.strokeRect(sx, sy, TILE_SIZE, TILE_SIZE);
    }
  }

  // Exits
  const pulse = 0.5 + 0.5 * Math.sin(now / 500);
  for (const exit of currentExits) {
    const ex = (exit.x + 0.5) * TILE_SIZE - camX;
    const ey = (exit.y + 0.5) * TILE_SIZE - camY;
    const isUp = exit.type === 'stairs_up';
    const exitClr = isUp ? '38,166,154' : '171,71,188';
    ctx.fillStyle = `rgba(${exitClr},${0.3 + 0.3 * pulse})`;
    ctx.beginPath(); ctx.arc(ex, ey, TILE_SIZE * 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255,255,255,${0.5 + 0.3 * pulse})`;
    ctx.font = `${TILE_SIZE * 0.5}px Courier New`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(isUp ? '▲' : '▼', ex, ey);
  }

  // NPCs
  const npcPulse = 0.5 + 0.5 * Math.sin(now / 800);
  for (const npc of currentNpcs) {
    const nx = npc.x - camX, ny = npc.y - camY;
    const r = PLAYER_RADIUS;

    // Diamond shape
    ctx.fillStyle = COLORS.npc;
    ctx.beginPath();
    ctx.moveTo(nx, ny - r);
    ctx.lineTo(nx + r, ny);
    ctx.lineTo(nx, ny + r);
    ctx.lineTo(nx - r, ny);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Name tag
    ctx.fillStyle = '#64b5f6';
    ctx.font = '11px Courier New';
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(npc.name, nx, ny - r - 6);

    // Interact prompt
    if (nearbyNPC === npc && !dialogueActive) {
      ctx.fillStyle = `rgba(255,255,255,${0.5 + 0.3 * npcPulse})`;
      ctx.font = '10px Courier New';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText('[E] Talk', nx, ny + r + 4);
    }
  }

  // Monsters
  for (const mob of monsters) {
    const mx = mob.x - camX, my = mob.y - camY;
    const mr = MONSTER_COLLISION_RADIUS;
    ctx.fillStyle = COLORS.monster;
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 2; ctx.stroke();
    const mfd = mr + 3;
    ctx.fillStyle = '#faa';
    ctx.beginPath(); ctx.arc(mx + Math.cos(mob.facing) * mfd, my + Math.sin(mob.facing) * mfd, 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e57373'; ctx.font = '10px Courier New';
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(mob.name, mx, my - mr - 6);
    const mbW = 26, mbH = 3;
    const mbx = mx - mbW / 2, mby = my - mr - 4;
    const mhp = mob.health / mob.maxHealth;
    ctx.fillStyle = '#333'; ctx.fillRect(mbx, mby, mbW, mbH);
    ctx.fillStyle = mhp > 0.5 ? '#e53935' : '#ff6f00';
    ctx.fillRect(mbx, mby, mbW * mhp, mbH);
  }

  // Players
  for (let i = 0; i < players.length; i++) {
    const p = players[i];
    const px = p.x - camX, py = p.y - camY;
    const isMe = (i === activePlayer);
    const color = COLORS.player[p.colorIndex];

    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(px, py, PLAYER_RADIUS, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 2; ctx.stroke();

    const fd = PLAYER_RADIUS + 4;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(px + Math.cos(p.facing) * fd, py + Math.sin(p.facing) * fd, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = isMe ? '#fff' : 'rgba(255,255,255,0.6)';
    ctx.font = '11px Courier New';
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(p.name, px, py - PLAYER_RADIUS - 6);

    const barW = 30, barH = 4;
    const bx = px - barW / 2, by = py - PLAYER_RADIUS - 4;
    const hp = p.health / p.maxHealth;
    ctx.fillStyle = '#333'; ctx.fillRect(bx, by, barW, barH);
    ctx.fillStyle = hp > 0.5 ? '#4caf50' : hp > 0.25 ? '#ffa726' : '#e53935';
    ctx.fillRect(bx, by, barW * hp, barH);

    if (isMe) {
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.arc(px, py, PLAYER_RADIUS + 6, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // Damage numbers
  const dnDt = 1 / 60;
  for (let di = damageNumbers.length - 1; di >= 0; di--) {
    const dn = damageNumbers[di];
    dn.age += dnDt;
    if (dn.age >= 1.0) { damageNumbers.splice(di, 1); continue; }
    const alpha = 1 - dn.age;
    const offY = dn.age * 40;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = dn.color;
    ctx.font = 'bold 13px Courier New';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(dn.text, dn.x - camX, dn.y - camY - offY);
    ctx.globalAlpha = 1;
  }

  // Minimap
  const mScale = 3;
  const mmW = MAP_W * mScale, mmH = MAP_H * mScale;
  const mmX = viewW - mmW - 8, mmY = 8;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(mmX - 2, mmY - 2, mmW + 4, mmH + 4);
  for (let ty = 0; ty < MAP_H; ty++) {
    for (let tx = 0; tx < MAP_W; tx++) {
      const tid = MAP_DATA[ty * MAP_W + tx];
      ctx.fillStyle = TILE_SOLID[tid] ? '#3a3a5a' : '#1a1a2e';
      ctx.fillRect(mmX + tx * mScale, mmY + ty * mScale, mScale, mScale);
    }
  }
  for (let i = 0; i < players.length; i++) {
    const p = players[i];
    ctx.fillStyle = i === activePlayer ? '#fff' : COLORS.player[p.colorIndex];
    ctx.fillRect(mmX + (p.x / TILE_SIZE) * mScale - 1, mmY + (p.y / TILE_SIZE) * mScale - 1, 3, 3);
  }
  // Monsters on minimap
  for (const mob of monsters) {
    ctx.fillStyle = COLORS.monster;
    ctx.fillRect(mmX + (mob.x / TILE_SIZE) * mScale - 1, mmY + (mob.y / TILE_SIZE) * mScale - 1, 2, 2);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1;
  ctx.strokeRect(mmX + (camX / TILE_SIZE) * mScale, mmY + (camY / TILE_SIZE) * mScale,
    VIEWPORT_TX * mScale, VIEWPORT_TY * mScale);

  // HUD (top-left)
  ctx.fillStyle = COLORS.player[activePlayer];
  ctx.font = 'bold 12px Courier New';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(`${players[activePlayer].name}`, 8, 8);
  ctx.fillStyle = '#666'; ctx.font = '10px Courier New';
  ctx.fillText(`HP ${players[activePlayer].health}/${players[activePlayer].maxHealth}`, 8, 22);
  ctx.fillStyle = '#555'; ctx.font = '9px Courier New';
  ctx.fillText(FLOORS[currentFloorId].name, 8, 34);
}

// ============================================================
// GAME LOOP
// ============================================================
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  update(dt, now);
  render(now);
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
