name: Build Godot Web Prototype

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Godot and web export templates
        shell: bash
        run: |
          set -euo pipefail
          release="${GODOT_VERSION}-${GODOT_STATUS}"
          base="https://github.com/godotengine/godot-builds/releases/download/${release}"
          wget -q "${base}/Godot_v${release}_linux.x86_64.zip"
          unzip -q "Godot_v${release}_linux.x86_64.zip"
          sudo install -m 0755 "Godot_v${release}_linux.x86_64" /usr/local/bin/godot

          wget -q "${base}/Godot_v${release}_export_templates.tpz"
          unzip -q "Godot_v${release}_export_templates.tpz"
          template_dir="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "${template_dir}"
          mv templates/* "${template_dir}/"

      - name: Import project and validate scripts
        run: godot --headless --path . --editor --quit

      - name: Export browser build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html

      - name: Upload playable browser build
        uses: actions/upload-artifact@v4
        with:
          name: lightkeeper-web
          path: build/web
          if-no-files-found: error

