name: Build Godot Web Prototype

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Godot and web export templates
        shell: bash
        run: |
          set -euo pipefail
          release="${GODOT_VERSION}-${GODOT_STATUS}"
          base="https://github.com/godotengine/godot-builds/releases/download/${release}"
          wget -q "${base}/Godot_v${release}_linux.x86_64.zip"
          unzip -q "Godot_v${release}_linux.x86_64.zip"
          sudo install -m 0755 "Godot_v${release}_linux.x86_64" /usr/local/bin/godot

          wget -q "${base}/Godot_v${release}_export_templates.tpz"
          unzip -q "Godot_v${release}_export_templates.tpz"
          template_dir="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "${template_dir}"
          mv templates/* "${template_dir}/"

      - name: Import project and validate scripts
        run: |
          log_file="$(mktemp)"
          godot --headless --path . --editor --quit 2>&1 | tee "${log_file}"
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|Compile Error:' "${log_file}"; then
            echo "Godot reported script errors even though the process returned success."
            exit 1
          fi

      - name: Test export versioning
        run: python3 -m unittest tests/test_version_web_export.py

      - name: Export browser build
        run: |
          mkdir -p build/web
          log_file="$(mktemp)"
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee "${log_file}"
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|Compile Error:' "${log_file}"; then
            echo "Godot exported an invalid project."
            exit 1
          fi

      - name: Version browser runtime files
        run: python3 tools/version_web_export.py build/web "${GITHUB_SHA}"

      - name: Install browser test engines
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Smoke test mobile browser boot
        run: |
          python3 -m http.server 8000 --directory build/web > /tmp/lightkeeper-server.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}"' EXIT
          node tests/web_boot_smoke.mjs

      - name: Upload playable browser build
        uses: actions/upload-artifact@v4
        with:
          name: lightkeeper-web
          path: build/web
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
