<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Lightkeeper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #0d0d1a;
      width: 100%; height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      color: #ccc;
    }

    #game-container {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    canvas {
      display: block;
      border: 1px solid #333;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #hud {
      position: absolute;
      top: 8px;
      left: 8px;
      pointer-events: none;
    }

    #hud .health-bar {
      width: 150px;
      height: 14px;
      background: #333;
      border: 1px solid #555;
      margin-bottom: 4px;
    }

    #hud .health-bar-fill {
      height: 100%;
      background: #e53935;
      transition: width 0.2s;
    }

    #hud .player-name {
      font-size: 11px;
      color: #aaa;
    }

    #join-screen {
      text-align: center;
    }

    #join-screen h1 {
      font-size: 28px;
      color: #ffa726;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    #join-screen p {
      font-size: 13px;
      color: #777;
      margin-bottom: 20px;
    }

    #join-screen input {
      background: #1a1a2e;
      border: 1px solid #444;
      color: #eee;
      padding: 8px 14px;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      text-align: center;
      outline: none;
      margin-bottom: 12px;
      display: block;
      width: 220px;
      margin-left: auto;
      margin-right: auto;
    }

    #join-screen input:focus {
      border-color: #ffa726;
    }

    #join-screen button {
      background: #ffa726;
      color: #1a1a2e;
      border: none;
      padding: 10px 28px;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
    }

    #join-screen button:hover {
      background: #ffb74d;
    }

    #connection-status {
      position: fixed;
      bottom: 10px;
      right: 14px;
      font-size: 11px;
      color: #555;
    }

    /* System message overlay (centered upper-third) */
    #dialogue-overlay {
      display: none;
      position: fixed;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 10, 26, 0.92);
      border: 1px solid rgba(100, 181, 246, 0.4);
      border-radius: 8px;
      padding: 16px 24px 14px;
      pointer-events: auto;
      z-index: 100;
      max-width: 340px;
      min-width: 200px;
      text-align: center;
      animation: dialogue-fade-in 0.2s ease-out;
    }

    @keyframes dialogue-fade-in {
      from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    #dialogue-overlay .dialogue-speaker {
      display: none;
    }

    #dialogue-overlay .dialogue-text {
      font-size: 14px;
      color: #ddd;
      line-height: 1.4;
    }

    #dialogue-overlay .dialogue-prompt {
      font-size: 10px;
      color: #777;
      margin-top: 10px;
    }

    /* Inventory panel */
    #inventory-panel {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 10, 26, 0.94);
      border: 2px solid #ffa726;
      padding: 16px 20px;
      min-width: 220px;
      max-width: 320px;
      max-height: 70vh;
      overflow-y: auto;
      z-index: 90;
      pointer-events: auto;
    }

    #inventory-panel .inv-title {
      font-size: 14px;
      color: #ffa726;
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-align: center;
    }

    #inventory-panel .inv-empty {
      font-size: 12px;
      color: #555;
      text-align: center;
      padding: 12px 0;
    }

    #inventory-panel .inv-item {
      font-size: 12px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    #inventory-panel .inv-item:active,
    #inventory-panel .inv-item:hover {
      background: rgba(255,255,255,0.05);
    }

    #inventory-panel .inv-item .inv-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    #inventory-panel .inv-item .inv-slot-tag {
      font-size: 9px;
      color: #888;
      margin-left: auto;
      flex-shrink: 0;
    }

    #inventory-panel .inv-item .inv-use-tag {
      font-size: 9px;
      color: #4caf50;
      margin-left: auto;
      flex-shrink: 0;
      border: 1px solid rgba(76,175,80,0.3);
      border-radius: 3px;
      padding: 1px 4px;
    }

    .equip-section {
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255,167,38,0.2);
      padding-bottom: 8px;
    }

    .equip-section .equip-label {
      font-size: 10px;
      color: #ffa726;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .equip-slot {
      font-size: 12px;
      padding: 5px 6px;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 3px;
      cursor: pointer;
    }

    .equip-slot:active,
    .equip-slot:hover {
      background: rgba(255,255,255,0.05);
    }

    .equip-slot .slot-name {
      font-size: 10px;
      color: #666;
      width: 58px;
      flex-shrink: 0;
      text-transform: capitalize;
    }

    .equip-slot .slot-item {
      color: #ccc;
    }

    .equip-slot .slot-empty {
      color: #444;
      font-style: italic;
    }

    #inventory-panel .inv-hint {
      font-size: 10px;
      color: #555;
      margin-top: 10px;
      text-align: center;
    }

    /* Virtual touch controls */
    #controls {
      width: 100%;
      height: 160px;
      position: relative;
      display: none;
      flex-shrink: 0;
    }

    #joystick-zone {
      position: absolute;
      left: 20px;
      bottom: 10px;
      width: 140px;
      height: 140px;
    }

    #joystick-base {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.12);
    }

    #joystick-thumb {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,167,38,0.35);
      border: 2px solid rgba(255,167,38,0.6);
      transition: background 0.1s;
    }

    /* Desktop action bar */
    #action-bar {
      display: none;
      width: 100%;
      background: rgba(10,10,26,0.85);
      border-top: 1px solid #333;
      padding: 6px 0;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .action-slot {
      width: 72px;
      height: 56px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .action-slot.empty {
      opacity: 0.3;
      cursor: default;
    }

    .action-slot:not(.empty):hover {
      background: rgba(255,255,255,0.08);
    }

    .action-slot:not(.empty):active {
      background: rgba(255,255,255,0.14);
    }

    .action-slot[data-slot="1"] { border-color: rgba(239,83,80,0.35); }
    .action-slot[data-slot="4"] { border-color: rgba(100,181,246,0.35); }

    .action-slot .slot-key {
      position: absolute;
      top: 3px;
      left: 5px;
      font-size: 9px;
      color: #666;
    }

    .action-slot .slot-label {
      font-size: 11px;
      color: #ccc;
      font-family: 'Courier New', monospace;
    }

    .action-slot.empty .slot-label {
      color: #555;
    }

    .action-slot .slot-shift {
      position: absolute;
      bottom: 3px;
      right: 5px;
      font-size: 8px;
      color: #555;
      display: none;
    }

    .action-slot.modifier-active .slot-shift {
      display: block;
      color: #b39ddb;
    }

    .action-slot.modifier-active {
      border-color: rgba(179,157,219,0.4);
    }

    .action-slot.modifier-active.empty {
      opacity: 1;
      cursor: pointer;
    }

    /* Mobile action buttons */
    #action-buttons {
      position: absolute;
      right: 20px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .action-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: auto;
    }

    .action-btn[data-slot="1"] {
      background: rgba(239,83,80,0.1);
      border: 2px solid rgba(239,83,80,0.25);
      color: #ef5350;
      font-size: 22px;
      font-weight: bold;
    }
    .action-btn[data-slot="1"]:active {
      background: rgba(239,83,80,0.3);
      border-color: rgba(239,83,80,0.6);
    }

    .action-btn[data-slot="4"] {
      background: rgba(100,181,246,0.1);
      border: 2px solid rgba(100,181,246,0.25);
      color: #64b5f6;
      font-size: 12px;
    }
    .action-btn[data-slot="4"]:active {
      background: rgba(100,181,246,0.3);
      border-color: rgba(100,181,246,0.6);
    }

    .action-btn.empty {
      background: rgba(255,255,255,0.03);
      border: 2px solid rgba(255,255,255,0.08);
      color: #444;
      opacity: 0.3;
      pointer-events: none;
    }

    #aim-joystick-zone {
      position: absolute;
      left: 20px;
      bottom: 170px;
      width: 100px;
      height: 100px;
      pointer-events: auto;
    }

    #aim-joystick-base {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(179,157,219,0.06);
      border: 2px solid rgba(179,157,219,0.15);
    }

    #aim-joystick-thumb {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(179,157,219,0.35);
      border: 2px solid rgba(179,157,219,0.5);
      transition: background 0.1s;
    }

    .info-text {
      font-size: 10px;
      color: #444;
      text-align: center;
      padding: 4px 0;
    }

    /* Rotate-to-landscape warning overlay */
    #rotate-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: #0d0d1a;
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ccc;
      font-size: 15px;
      text-align: center;
      gap: 18px;
      pointer-events: none;
    }

    #rotate-warning .rotate-icon {
      font-size: 52px;
      color: #ffa726;
      display: block;
      animation: spin-hint 2s ease-in-out infinite;
    }

    @keyframes spin-hint {
      0%, 100% { transform: rotate(0deg); }
      40%       { transform: rotate(-90deg); }
      60%       { transform: rotate(-90deg); }
    }

    /* Desktop: hide touch controls, show action bar */
    @media (hover: hover) and (pointer: fine) {
      #controls { display: none !important; }
      .mobile-only { display: none !important; }
      #action-bar { display: flex !important; }
    }

    /* Touch in portrait: show rotate warning, hide controls */
    @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
      #rotate-warning { display: flex !important; }
      .desktop-only { display: none !important; }
    }

    /* Touch in landscape: fullscreen overlay controls */
    @media (hover: none) and (pointer: coarse) and (orientation: landscape) {
      /* Game fills the whole screen */
      #game-container {
        width: 100%;
        height: 100%;
      }

      /* Controls float as a transparent overlay over the game */
      #controls {
        display: block !important;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .desktop-only { display: none !important; }

      /* Each control is independently tappable */
      #joystick-zone,
      #action-buttons,
      #aim-joystick-zone {
        pointer-events: auto;
      }
    }
  </style>
</head>
<body>

  <!-- Join screen -->
  <div id="join-screen">
    <h1>⚔ LIGHTKEEPER ⚔</h1>
    <p>Loot is precious. Death is costly.</p>
    <input type="text" id="name-input" placeholder="Enter your name" maxlength="16" autofocus>
    <button id="join-btn">ENTER THE DUNGEON</button>
  </div>

  <!-- Game container (hidden until joined) -->
  <div id="game-container" style="display: none;">
    <canvas id="game-canvas"></canvas>
    <div id="hud">
      <div class="health-bar"><div class="health-bar-fill" id="health-fill"></div></div>
      <div class="player-name" id="hud-name"></div>
    </div>
  </div>

  <!-- Desktop action bar -->
  <div id="action-bar">
    <div class="action-slot empty" data-slot="1">
      <span class="slot-key">1</span>
      <span class="slot-label">&mdash;</span>
      <span class="slot-shift">Blaster</span>
    </div>
    <div class="action-slot empty" data-slot="2">
      <span class="slot-key">2</span>
      <span class="slot-label">—</span>
      <span class="slot-shift"></span>
    </div>
    <div class="action-slot empty" data-slot="3">
      <span class="slot-key">3</span>
      <span class="slot-label">—</span>
      <span class="slot-shift"></span>
    </div>
    <div class="action-slot" data-slot="4">
      <span class="slot-key">4</span>
      <span class="slot-label">Interact</span>
      <span class="slot-shift">Inventory</span>
    </div>
  </div>

  <!-- Mobile touch controls -->
  <div id="controls">
    <div id="joystick-zone">
      <div id="joystick-base"></div>
      <div id="joystick-thumb"></div>
    </div>
    <div id="aim-joystick-zone">
      <div id="aim-joystick-base"></div>
      <div id="aim-joystick-thumb"></div>
    </div>
    <div id="action-buttons">
      <div class="action-btn" data-slot="1" role="button">⚡</div>
      <div class="action-btn empty" data-slot="2" role="button">—</div>
      <div class="action-btn empty" data-slot="3" role="button">—</div>
      <div class="action-btn" data-slot="4" role="button">Interact</div>
    </div>
  </div>

  <div id="inventory-panel">
    <div class="inv-title">EQUIPMENT</div>
    <div id="equipment-slots" class="equip-section">
      <div class="equip-label">SLOTS</div>
    </div>
    <div class="inv-title">INVENTORY</div>
    <div id="inventory-list"></div>
    <div class="inv-hint">[I] Close</div>
  </div>

  <div id="dialogue-overlay">
    <div class="dialogue-speaker" id="dialogue-speaker"></div>
    <div class="dialogue-text" id="dialogue-text"></div>
    <div class="dialogue-prompt">[E] Continue</div>
  </div>

  <!-- Portrait orientation warning (touch only) -->
  <div id="rotate-warning">
    <span class="rotate-icon">&#8635;</span>
    <span>Rotate your device to play</span>
  </div>

  <div id="connection-status">Disconnected</div>

  <!-- Scripts -->
  <script src="lib/pixi.min.js"></script>
  <script src="/shared/constants.js"></script>
  <script src="net.js"></script>
  <script src="input.js"></script>
  <script src="renderer.js"></script>
  <script src="main.js"></script>

</body>
</html>
