<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Dungeon Crawler</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #0d0d1a;
      width: 100%; height: 100%;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      color: #ccc;
    }

    #game-container {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    canvas {
      display: block;
      border: 1px solid #333;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #hud {
      position: absolute;
      top: 8px;
      left: 8px;
      pointer-events: none;
    }

    #hud .health-bar {
      width: 150px;
      height: 14px;
      background: #333;
      border: 1px solid #555;
      margin-bottom: 4px;
    }

    #hud .health-bar-fill {
      height: 100%;
      background: #e53935;
      transition: width 0.2s;
    }

    #hud .player-name {
      font-size: 11px;
      color: #aaa;
    }

    #join-screen {
      text-align: center;
    }

    #join-screen h1 {
      font-size: 28px;
      color: #ffa726;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    #join-screen p {
      font-size: 13px;
      color: #777;
      margin-bottom: 20px;
    }

    #join-screen input {
      background: #1a1a2e;
      border: 1px solid #444;
      color: #eee;
      padding: 8px 14px;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      text-align: center;
      outline: none;
      margin-bottom: 12px;
      display: block;
      width: 220px;
      margin-left: auto;
      margin-right: auto;
    }

    #join-screen input:focus {
      border-color: #ffa726;
    }

    #join-screen button {
      background: #ffa726;
      color: #1a1a2e;
      border: none;
      padding: 10px 28px;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
    }

    #join-screen button:hover {
      background: #ffb74d;
    }

    #connection-status {
      position: fixed;
      bottom: 10px;
      right: 14px;
      font-size: 11px;
      color: #555;
    }

    /* Dialogue overlay */
    #dialogue-overlay {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10, 10, 26, 0.92);
      border-top: 2px solid #64b5f6;
      padding: 14px 18px 12px;
      pointer-events: auto;
      z-index: 100;
    }

    #dialogue-overlay .dialogue-speaker {
      font-size: 12px;
      color: #64b5f6;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    #dialogue-overlay .dialogue-text {
      font-size: 14px;
      color: #ddd;
      line-height: 1.4;
      min-height: 38px;
    }

    #dialogue-overlay .dialogue-prompt {
      font-size: 10px;
      color: #777;
      margin-top: 8px;
      text-align: right;
    }

    /* Inventory panel */
    #inventory-panel {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 10, 26, 0.94);
      border: 2px solid #ffa726;
      padding: 16px 20px;
      min-width: 220px;
      max-width: 320px;
      max-height: 70vh;
      overflow-y: auto;
      z-index: 90;
      pointer-events: auto;
    }

    #inventory-panel .inv-title {
      font-size: 14px;
      color: #ffa726;
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-align: center;
    }

    #inventory-panel .inv-empty {
      font-size: 12px;
      color: #555;
      text-align: center;
      padding: 12px 0;
    }

    #inventory-panel .inv-item {
      font-size: 12px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    #inventory-panel .inv-item:active,
    #inventory-panel .inv-item:hover {
      background: rgba(255,255,255,0.05);
    }

    #inventory-panel .inv-item .inv-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    #inventory-panel .inv-item .inv-slot-tag {
      font-size: 9px;
      color: #888;
      margin-left: auto;
      flex-shrink: 0;
    }

    .equip-section {
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255,167,38,0.2);
      padding-bottom: 8px;
    }

    .equip-section .equip-label {
      font-size: 10px;
      color: #ffa726;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .equip-slot {
      font-size: 12px;
      padding: 5px 6px;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 3px;
      cursor: pointer;
    }

    .equip-slot:active,
    .equip-slot:hover {
      background: rgba(255,255,255,0.05);
    }

    .equip-slot .slot-name {
      font-size: 10px;
      color: #666;
      width: 58px;
      flex-shrink: 0;
      text-transform: capitalize;
    }

    .equip-slot .slot-item {
      color: #ccc;
    }

    .equip-slot .slot-empty {
      color: #444;
      font-style: italic;
    }

    #inventory-panel .inv-hint {
      font-size: 10px;
      color: #555;
      margin-top: 10px;
      text-align: center;
    }

    /* Virtual touch controls */
    #controls {
      width: 100%;
      height: 160px;
      position: relative;
      display: none;
      flex-shrink: 0;
    }

    #joystick-zone {
      position: absolute;
      left: 20px;
      bottom: 10px;
      width: 140px;
      height: 140px;
    }

    #joystick-base {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.12);
    }

    #joystick-thumb {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,167,38,0.35);
      border: 2px solid rgba(255,167,38,0.6);
      transition: background 0.1s;
    }

    #interact-btn {
      position: absolute;
      right: 30px;
      bottom: 45px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(100,181,246,0.1);
      border: 2px solid rgba(100,181,246,0.25);
      color: #64b5f6;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #interact-btn:active {
      background: rgba(100,181,246,0.3);
      border-color: rgba(100,181,246,0.6);
    }

    #inventory-btn {
      position: absolute;
      right: 110px;
      bottom: 55px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255,167,38,0.1);
      border: 2px solid rgba(255,167,38,0.25);
      color: #ffa726;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #inventory-btn:active {
      background: rgba(255,167,38,0.3);
      border-color: rgba(255,167,38,0.6);
    }

    .info-text {
      font-size: 10px;
      color: #444;
      text-align: center;
      padding: 4px 0;
    }

    /* Desktop: hide touch controls, show keyboard hint */
    @media (hover: hover) and (pointer: fine) {
      #controls { display: none !important; }
      .mobile-only { display: none !important; }
    }
    /* Touch devices: show controls */
    @media (hover: none) and (pointer: coarse) {
      #controls { display: block !important; }
      .desktop-only { display: none !important; }
    }
  </style>
</head>
<body>

  <!-- Join screen -->
  <div id="join-screen">
    <h1>⚔ DUNGEON CRAWLER ⚔</h1>
    <p>Loot is precious. Death is costly.</p>
    <input type="text" id="name-input" placeholder="Enter your name" maxlength="16" autofocus>
    <button id="join-btn">ENTER THE DUNGEON</button>
  </div>

  <!-- Game container (hidden until joined) -->
  <div id="game-container" style="display: none;">
    <canvas id="game-canvas"></canvas>
    <div id="hud">
      <div class="health-bar"><div class="health-bar-fill" id="health-fill"></div></div>
      <div class="player-name" id="hud-name"></div>
    </div>
  </div>

  <div class="info-text desktop-only">WASD / Arrows = Move &nbsp;|&nbsp; E = Interact &nbsp;|&nbsp; I = Inventory</div>

  <div id="controls">
    <div id="joystick-zone">
      <div id="joystick-base"></div>
      <div id="joystick-thumb"></div>
    </div>
    <div id="inventory-btn" role="button">Bag</div>
    <div id="interact-btn" role="button">Interact</div>
  </div>

  <div id="inventory-panel">
    <div class="inv-title">EQUIPMENT</div>
    <div id="equipment-slots" class="equip-section">
      <div class="equip-label">SLOTS</div>
    </div>
    <div class="inv-title">INVENTORY</div>
    <div id="inventory-list"></div>
    <div class="inv-hint">[I] Close</div>
  </div>

  <div id="dialogue-overlay">
    <div class="dialogue-speaker" id="dialogue-speaker"></div>
    <div class="dialogue-text" id="dialogue-text"></div>
    <div class="dialogue-prompt">[E] Continue</div>
  </div>

  <div id="connection-status">Disconnected</div>

  <!-- Scripts -->
  <script src="/shared/constants.js"></script>
  <script src="net.js"></script>
  <script src="input.js"></script>
  <script src="renderer.js"></script>
  <script src="main.js"></script>

</body>
</html>
