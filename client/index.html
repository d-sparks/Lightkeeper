<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeon Crawler</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Courier New', monospace;
      color: #ccc;
      overflow: hidden;
    }

    #game-container {
      position: relative;
    }

    canvas {
      display: block;
      border: 2px solid #333;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #hud {
      position: absolute;
      top: 8px;
      left: 8px;
      pointer-events: none;
    }

    #hud .health-bar {
      width: 150px;
      height: 14px;
      background: #333;
      border: 1px solid #555;
      margin-bottom: 4px;
    }

    #hud .health-bar-fill {
      height: 100%;
      background: #e53935;
      transition: width 0.2s;
    }

    #hud .player-name {
      font-size: 11px;
      color: #aaa;
    }

    #join-screen {
      text-align: center;
    }

    #join-screen h1 {
      font-size: 28px;
      color: #ffa726;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    #join-screen p {
      font-size: 13px;
      color: #777;
      margin-bottom: 20px;
    }

    #join-screen input {
      background: #1a1a2e;
      border: 1px solid #444;
      color: #eee;
      padding: 8px 14px;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      text-align: center;
      outline: none;
      margin-bottom: 12px;
      display: block;
      width: 220px;
      margin-left: auto;
      margin-right: auto;
    }

    #join-screen input:focus {
      border-color: #ffa726;
    }

    #join-screen button {
      background: #ffa726;
      color: #1a1a2e;
      border: none;
      padding: 10px 28px;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
    }

    #join-screen button:hover {
      background: #ffb74d;
    }

    #connection-status {
      position: fixed;
      bottom: 10px;
      right: 14px;
      font-size: 11px;
      color: #555;
    }

    /* Dialogue overlay */
    #dialogue-overlay {
      display: none;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10, 10, 26, 0.92);
      border-top: 2px solid #64b5f6;
      padding: 14px 18px 12px;
      pointer-events: auto;
    }

    #dialogue-overlay .dialogue-speaker {
      font-size: 12px;
      color: #64b5f6;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    #dialogue-overlay .dialogue-text {
      font-size: 14px;
      color: #ddd;
      line-height: 1.4;
      min-height: 38px;
    }

    #dialogue-overlay .dialogue-prompt {
      font-size: 10px;
      color: #777;
      margin-top: 8px;
      text-align: right;
    }
  </style>
</head>
<body>

  <!-- Join screen -->
  <div id="join-screen">
    <h1>⚔ DUNGEON CRAWLER ⚔</h1>
    <p>Loot is precious. Death is costly.</p>
    <input type="text" id="name-input" placeholder="Enter your name" maxlength="16" autofocus>
    <button id="join-btn">ENTER THE DUNGEON</button>
  </div>

  <!-- Game container (hidden until joined) -->
  <div id="game-container" style="display: none;">
    <canvas id="game-canvas"></canvas>
    <div id="hud">
      <div class="health-bar"><div class="health-bar-fill" id="health-fill"></div></div>
      <div class="player-name" id="hud-name"></div>
    </div>
    <div id="dialogue-overlay">
      <div class="dialogue-speaker" id="dialogue-speaker"></div>
      <div class="dialogue-text" id="dialogue-text"></div>
      <div class="dialogue-prompt">[E] Continue</div>
    </div>
  </div>

  <div id="connection-status">Disconnected</div>

  <!-- Scripts -->
  <script src="/shared/constants.js"></script>
  <script src="net.js"></script>
  <script src="input.js"></script>
  <script src="renderer.js"></script>
  <script src="main.js"></script>

</body>
</html>
