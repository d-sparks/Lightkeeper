<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lightkeeper - Checkpoints</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }
    #app { max-width: 900px; margin: 0 auto; padding: 20px; }
    h1 { color: #4fc3f7; margin-bottom: 20px; font-size: 1.5rem; }
    h2 { color: #90caf9; margin-bottom: 12px; font-size: 1.1rem; }

    .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 80vh; }
    .login-box { background: #2a2a3d; padding: 32px; border-radius: 8px; width: 320px; }
    .login-box h2 { text-align: center; margin-bottom: 16px; }
    .login-box input { width: 100%; padding: 10px; border: 1px solid #444; border-radius: 4px; background: #1a1a2e; color: #e0e0e0; margin-bottom: 12px; font-size: 14px; }
    .login-box button { width: 100%; padding: 10px; background: #4fc3f7; color: #1a1a2e; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; }
    .login-box button:hover { background: #81d4fa; }
    .login-error { color: #ef5350; font-size: 13px; margin-bottom: 8px; }

    .toolbar { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
    .toolbar button { padding: 8px 16px; background: #5a5a7a; color: #e0e0e0; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .toolbar button:hover { background: #6b6b8d; }
    .toolbar .commit-btn { background: #66bb6a; color: #1a1a2e; font-weight: 600; }
    .toolbar .commit-btn:hover { background: #81c784; }

    .panel { background: #2a2a3d; border-radius: 8px; padding: 16px; margin-bottom: 20px; }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #3a3a4d; font-size: 13px; }
    th { color: #90caf9; font-weight: 600; font-size: 12px; text-transform: uppercase; }

    .btn { padding: 5px 12px; border: none; border-radius: 3px; cursor: pointer; font-size: 12px; }
    .btn-save { background: #4fc3f7; color: #1a1a2e; font-weight: 600; }
    .btn-save:hover { background: #81d4fa; }
    .btn-load { background: #66bb6a; color: #1a1a2e; font-weight: 600; }
    .btn-load:hover { background: #81c784; }
    .btn-delete { background: #ef5350; color: #fff; }
    .btn-delete:hover { background: #f44336; }
    .btn:disabled { opacity: 0.4; cursor: default; }

    select { padding: 5px 8px; border: 1px solid #444; border-radius: 3px; background: #1a1a2e; color: #e0e0e0; font-size: 12px; }

    .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 6px; font-size: 14px; z-index: 999; transition: opacity 0.3s; }
    .toast-ok { background: #2e7d32; color: #fff; }
    .toast-err { background: #c62828; color: #fff; }
    .empty { color: #777; font-style: italic; padding: 12px 0; }

    .quest-jump-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .quest-jump-row select { flex: 1; min-width: 120px; }
    .btn-jump { background: #ff9800; color: #1a1a2e; font-weight: 600; }
    .btn-jump:hover { background: #ffb74d; }

    .dag-quest { margin-bottom: 16px; }
    .dag-quest:last-child { margin-bottom: 0; }
    .dag-quest-title { color: #4fc3f7; font-size: 0.95rem; margin-bottom: 8px; }
    .dag-scroll { overflow-x: auto; padding-bottom: 4px; }
    .dag-svg { display: block; min-width: 100%; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/checkpoint/app.js"></script>
</body>
</html>
